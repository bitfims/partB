<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard | UNIVEN BuildSafe</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="logo">UNIVEN<span>BuildSafe</span></div>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="map.html">Map</a>
    <a href="projects.html">Projects</a>
    <a href="announcements.html">Notices</a>
    <a href="report.html">Report</a>
    <a id="adminLink" href="admin.html" hidden>Admin</a>
    <button id="logout" class="link-button">Logout</button>
  </nav>
</header>
<main class="container">
  <section class="welcome">
    <div>
      <p class="tag">UNIVEN CAMPUS</p>
      <h1 id="welcome">Welcome</h1>
      <p>Monitor construction and stay informed about affected campus areas.</p>
    </div>
    <a class="btn" href="map.html">Open Campus Map</a>
  </section>

  <section class="stats">
    <div class="stat"><span id="totalProjects">0</span><small>Total Projects</small></div>
    <div class="stat"><span id="activeProjects">0</span><small>In Progress</small></div>
    <div class="stat"><span id="plannedProjects">0</span><small>Planned</small></div>
    <div class="stat"><span id="reportCount">0</span><small>Reports</small></div>
  </section>

  <section>
    <div class="section-title"><h2>Latest Construction</h2><a href="projects.html">View all</a></div>
    <div id="projectCards" class="cards"></div>
  </section>

  <section>
    <div class="section-title"><h2>Latest Notices</h2><a href="announcements.html">View all</a></div>
    <div id="notices" class="notice-list"></div>
  </section>
</main>


<!--change 5-->
<script src="js/common.js"></script>

<script src="js/dashboard.js"></script>



</body>
</html>
