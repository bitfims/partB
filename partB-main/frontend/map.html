<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campus Map | UNIVEN BuildSafe</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<header class="topbar">
  <div class="logo">UNIVEN<span>BuildSafe</span></div>
  <nav><a href="dashboard.html">Dashboard</a><a class="active" href="map.html">Map</a><a href="projects.html">Projects</a><a href="report.html">Report</a><button id="logout" class="link-button">Logout</button></nav>
</header>
<main class="container">
  <div class="section-title"><div><p class="tag">INTERACTIVE MAP</p><h1>Construction Areas</h1></div></div>
  <div class="map-layout">
    <div id="map"></div>
    <aside class="map-info">
      <h2>Project status</h2>
      <p><span class="dot red"></span> In Progress</p>
      <p><span class="dot yellow"></span> Planned</p>
      <p><span class="dot green"></span> Completed</p>
      <hr>
      <p>Click a marker to view project information.</p>
      <div class="warning">⚠ Demo coordinates are used in this version. Verify campus coordinates before deployment.</div>
    </aside>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
